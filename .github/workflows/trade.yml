name: Trade

# US options trade 09:30-16:00 ET, which is 13:30-20:00 UTC. Running every
# half hour across that window gives the agent room to manage exits and look
# for entries without hammering the API. Cron in Actions is best-effort and
# can run late; every step is written to tolerate that, and the agent re-reads
# live state at the start of each cycle rather than trusting anything cached.
on:
  schedule:
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report without sending orders"
        type: boolean
        default: false

concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_ACCOUNT_ID: ${{ secrets.ALPACA_ACCOUNT_ID }}
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install the Alpaca CLI
        run: |
          go install github.com/alpacahq/cli/cmd/alpaca@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Confirm credentials and paper mode
        run: |
          alpaca version
          alpaca doctor

      - name: Manage open positions
        run: python scripts/manage.py $DRY_RUN

      - name: Look for an entry
        run: python scripts/run_once.py $DRY_RUN

      - name: Refresh the dashboard
        if: always()
        run: python scripts/report.py

      - name: Publish the ledger
        if: always()
        run: |
          git config user.name "options-alpha-agent"
          git config user.email "noreply@github.com"
          git add docs/ledger public/data.json
          if git diff --cached --quiet; then
            echo "nothing changed this cycle"
          else
            git commit -m "Cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another cycle may have landed while this one ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
