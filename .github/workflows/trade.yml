name: Trade

# Dispatch-only, on purpose. During the judged session the runner is
# scripts/session.sh in a single container, and exactly one runner may be
# live: two would each see a flat book and each open a position. A cron here
# would be a second runner the moment the repository secrets exist. To run a
# cycle from Actions instead, stop the container runner first, then dispatch.
#
# Every step is written to tolerate a late start, and the agent re-reads live
# state at the beginning of each cycle rather than trusting anything cached.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report without sending orders"
        type: boolean
        default: false

concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_ACCOUNT_ID: ${{ secrets.ALPACA_ACCOUNT_ID }}
      FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install the Alpaca CLI
        run: |
          go install github.com/alpacahq/cli/cmd/alpaca@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Confirm credentials and paper mode
        run: |
          alpaca version
          alpaca doctor

      - name: Manage open positions
        run: python scripts/manage.py $DRY_RUN

      - name: Look for an entry
        run: python scripts/run_once.py $DRY_RUN

      - name: Rebuild every receipt
        if: always()
        run: |
          python scripts/score_refusals.py
          python scripts/score_shadow.py
          python scripts/grade_invalidations.py
          python scripts/reconcile.py
          python scripts/report.py

      - name: Publish the ledger
        if: always()
        run: |
          git config user.name "options-alpha-agent"
          git config user.email "noreply@github.com"
          git add docs/ledger public/*.json
          if git diff --cached --quiet; then
            echo "nothing changed this cycle"
          else
            git commit -m "Cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another cycle may have landed while this one ran.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
